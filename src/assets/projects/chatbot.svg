<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171720" />
      <stop offset="100%" stop-color="#101015" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bubbleBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D1D28" />
      <stop offset="100%" stop-color="#242436" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#09090B" />
  
  <!-- Subtle ambient glow -->
  <circle cx="200" cy="180" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="320" r="140" fill="#06B6D4" opacity="0.1" filter="url(#glow)" />

  <!-- Code/Terminal Window Frame -->
  <rect x="70" y="45" width="660" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <path d="M 70 61 C 70 52 77 45 86 45 L 714 45 C 723 45 730 52 730 61 L 730 95 L 70 95 Z" fill="#14141C" />
  <line x1="70" y1="95" x2="730" y2="95" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="102" cy="70" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="122" cy="70" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="142" cy="70" r="6" fill="#10B981" opacity="0.8" />

  <!-- Title -->
  <text x="400" y="74" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle" font-weight="500">
    chatbot_code.ipynb — NLTK &amp; NLP Model Pipeline
  </text>
  
  <!-- Status Badge -->
  <rect x="620" y="60" width="88" height="22" rx="11" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
  <circle cx="632" cy="71" r="3.5" fill="#06B6D4" />
  <text x="642" y="75" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Active</text>

  <!-- Left: ML & Tokenization Flow Diagram -->
  <g transform="translate(105, 125)">
    <!-- Pipeline Box 1 -->
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#1D1D28" stroke="rgba(139, 92, 246, 0.3)" />
    <text x="20" y="24" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Text Preprocessing</text>
    <text x="20" y="40" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="10">nltk.word_tokenize()</text>

    <!-- Down arrow -->
    <path d="M 90 56 L 90 74 M 86 70 L 90 75 L 94 70" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" />

    <!-- Pipeline Box 2 -->
    <rect x="0" y="78" width="180" height="52" rx="10" fill="#1D1D28" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="20" y="102" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Lemmatization &amp; Bag</text>
    <text x="20" y="118" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="10">WordNetLemmatizer</text>

    <!-- Down arrow -->
    <path d="M 90 134 L 90 152 M 86 148 L 90 153 L 94 148" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" />

    <!-- Pipeline Box 3 -->
    <rect x="0" y="156" width="180" height="52" rx="10" fill="#1D1D28" stroke="rgba(139, 92, 246, 0.4)" />
    <text x="20" y="180" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Intent Classifier</text>
    <text x="20" y="196" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">Similarity &amp; Softmax</text>

    <!-- Down arrow -->
    <path d="M 90 212 L 90 230 M 86 226 L 90 231 L 94 226" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" />

    <!-- Pipeline Box 4 -->
    <rect x="0" y="234" width="180" height="52" rx="10" fill="url(#bubbleUser)" opacity="0.9" />
    <text x="20" y="258" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Natural Response</text>
    <text x="20" y="274" fill="rgba(255,255,255,0.8)" font-family="'JetBrains Mono', monospace" font-size="10">Contextual Output</text>
  </g>

  <!-- Right: Simulated Interactive Chat View -->
  <g transform="translate(325, 120)">
    <rect x="0" y="0" width="375" height="295" rx="12" fill="#12121A" stroke="rgba(255, 255, 255, 0.06)" />
    
    <!-- User Message 1 -->
    <rect x="140" y="25" width="215" height="42" rx="14" fill="url(#bubbleUser)" />
    <text x="156" y="50" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">Hello, can you assist me?</text>

    <!-- Bot Response 1 -->
    <rect x="20" y="80" width="250" height="56" rx="14" fill="url(#bubbleBot)" stroke="rgba(255,255,255,0.06)" />
    <text x="36" y="104" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="12">Greetings! I am your AI assistant.</text>
    <text x="36" y="122" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11">How can I support your inquiry today?</text>

    <!-- User Message 2 -->
    <rect x="120" y="150" width="235" height="42" rx="14" fill="url(#bubbleUser)" />
    <text x="136" y="175" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12">Explain the chatbot architecture.</text>

    <!-- Bot Response 2 -->
    <rect x="20" y="205" width="280" height="60" rx="14" fill="url(#bubbleBot)" stroke="rgba(255,255,255,0.06)" />
    <text x="36" y="228" fill="#FAFAFA" font-family="'Inter', sans-serif" font-size="11.5">Parsed via NLTK tokenizer &amp; bag-of-words.</text>
    <text x="36" y="246" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="10.5">Confidence: 98.4% | Class: info_request</text>
  </g>
</svg>
